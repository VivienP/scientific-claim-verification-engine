[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientific-claim-verification-engine"
version = "0.1.0"
description = "Pipeline that extracts and verifies scientific claims against their cited sources"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
edison = [
    "edison-client",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# System prompt strings and test JSON literals legitimately exceed 100 chars
"src/extract.py" = ["E501"]
"src/verify.py" = ["E501"]
"src/verify_prompts.py" = ["E501"]
"src/chunker.py" = ["E501"]
"src/clients/crossref.py" = ["E501"]
"src/clients/pmc.py" = ["E501"]
"src/numeric/extract.py" = ["E501"]
"src/numeric/checks.py" = ["E501"]
"src/report.py" = ["E501"]
"tests/unit/test_extract.py" = ["E501"]
"tests/unit/test_verify_abstract.py" = ["E501"]
"tests/unit/test_verify_fulltext.py" = ["E501"]
"tests/unit/test_report.py" = ["E501"]
"tests/unit/test_chunker.py" = ["E501"]
"tests/unit/test_fetch_fulltext.py" = ["E501"]
"tests/unit/test_openalex.py" = ["E501"]
"scripts/eval_scifact.py" = ["E501"]
"scripts/generate_summary.py" = ["E501"]
# Phase C API tests use Any-typed worker fixtures intentionally (heterogeneous
# fake objects with attached attributes — Protocol typing would be heavier than
# the fixture warrants).
"tests/unit/test_api_app.py" = ["ANN401"]
# diagnose_ctran is loaded dynamically via importlib; the render_markdown test
# helper that instantiates _diag.ClaimDiagnosis cannot annotate its return type
# without a static import (which would defeat the script-as-module loader).
"tests/unit/test_diagnose_ctran.py" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
